---
- name: Verify
  hosts: all
  vars:
    home_user: "somaz"
    krew_plugins:
      - "ctx"
      - "neat"
      - "ns"
  tasks:
    - name: Check kubectl client version
      ansible.builtin.command: kubectl version --client
      register: kubectl_result
      changed_when: false

    - name: Assert kubectl is properly installed
      ansible.builtin.assert:
        that:
          - kubectl_result.rc == 0
          - "'Client Version' in kubectl_result.stdout"
        fail_msg: "kubectl is not properly installed"
        quiet: true

    - name: Get user home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ home_user }}"

    - name: Set user home directory fact
      ansible.builtin.set_fact:
        user_home_dir: "{{ ansible_facts.getent_passwd[home_user][4] }}"

    - name: Check krew binary version
      ansible.builtin.command:
        cmd: "{{ user_home_dir }}/.krew/bin/kubectl-krew version"
      register: krew_result
      changed_when: false

    - name: Assert krew is properly installed
      ansible.builtin.assert:
        that:
          - krew_result.rc == 0
        fail_msg: "krew is not properly installed"
        quiet: true

    - name: List installed krew plugins
      ansible.builtin.command: "{{ user_home_dir }}/.krew/bin/kubectl-krew list"
      register: krew_plugin_list
      changed_when: false
      environment:
        KREW_ROOT: "{{ user_home_dir }}/.krew"

    - name: Assert each expected plugin is installed
      ansible.builtin.assert:
        that:
          - item in (krew_plugin_list.stdout_lines | map('split') | map('first') | list)
        fail_msg: "krew plugin '{{ item }}' is not installed"
        quiet: true
      loop: "{{ krew_plugins }}"
