---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2204}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # Workaround: molecule-plugins/docker destroy.yml uses non-boolean
    # lookup() in `when:` which ansible-core >=2.18 rejects. Remove once
    # molecule-plugins ships a fix.
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "True"
verifier:
  name: ansible
